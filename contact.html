<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Audrina Xie</title>
<style>
  :root{
    --ink:#1c1a16;
    --paper:#f1ece1;
    --paper-dim:#e6ddcb;
    --rust:#a63d2f;
    --slate:#3d4a44;
    --gold:#b48a2e;
    --line: rgba(28,26,22,0.16);
    --frame-a: linear-gradient(155deg,#8a7a68 0%,#5c5346 45%,#2e2a24 100%);
    --frame-b: linear-gradient(160deg,#6b7a76 0%,#3f4d49 50%,#22302c 100%);
    --frame-c: linear-gradient(150deg,#a68a63 0%,#7a5c3d 45%,#3b2a1c 100%);
    --frame-d: linear-gradient(165deg,#94918a 0%,#5e5b54 50%,#2a2825 100%);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ink:#f1ece1;
      --paper:#17150f;
      --paper-dim:#211e17;
      --line: rgba(241,236,225,0.14);
    }
  }
  :root[data-theme="dark"]{
    --ink:#f1ece1;
    --paper:#17150f;
    --paper-dim:#211e17;
    --line: rgba(241,236,225,0.14);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Times New Roman', Times, serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition:background .3s ease, color .3s ease;
  }
  img{max-width:100%; display:block;}
  a{color:inherit;}

  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:0 clamp(20px,4vw,56px);
  }

  h1,h2,h3,.serif{
    font-family:'Times New Roman', Times, serif;
    font-weight:500;
    letter-spacing:-0.01em;
    line-height:1.05;
  }

  /* ===== Masthead ===== */
  header.masthead{
    border-bottom:1px solid var(--line);
    padding:22px 0 18px;
  }
  .masthead-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }
  .wordmark{
    font-family:'Times New Roman', Times, serif;
    font-weight:600;
    font-size:clamp(22px,3vw,28px);
    letter-spacing:-0.02em;
  }
  .masthead-meta{
    font-size:12.5px;
    letter-spacing:0.02em;
    opacity:0.62;
    display:flex;
    gap:18px;
  }
  nav.subnav{
    display:flex;
    gap:26px;
    margin-top:14px;
    font-size:13.5px;
    flex-wrap:wrap;
  }
  nav.subnav a{
    text-decoration:none;
    padding-bottom:3px;
    border-bottom:1px solid transparent;
    opacity:0.8;
    transition:opacity .2s ease, border-color .2s ease;
  }
  nav.subnav a:hover, nav.subnav a:focus-visible{
    opacity:1;
    border-color:var(--rust);
  }
  nav.subnav a.active{
    opacity:1;
    border-color:var(--ink);
  }

  /* ===== Hero / cover spread ===== */
  .cover{
    padding:clamp(40px,7vw,84px) 0 clamp(50px,8vw,96px);
    display:grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap:clamp(28px,4vw,56px);
    align-items:end;
  }
  .cover-frame{
    background:var(--frame-a);
    position:relative;
    overflow:hidden;
  }
  .cover-frame img.frame-photo{
    position:static;
    width:100%; height:auto;
    display:block;
  }
  .cover-frame::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
    opacity:0.5;
  }
  .frame-tag{
    position:absolute;
    left:14px; bottom:14px;
    color:#f1ece1;
    font-size:11.5px;
    letter-spacing:0.04em;
    opacity:0.85;
    font-variant-numeric: tabular-nums;
  }
  .cover-text{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .kicker{
    font-size:13px;
    color:var(--rust);
    font-weight:500;
  }
  .cover-title{
    font-size:clamp(40px,6vw,72px);
    font-style:italic;
    font-weight:400;
  }
  .cover-dek{
    font-size:16.5px;
    line-height:1.55;
    max-width:46ch;
    opacity:0.85;
  }
  .cover-links{
    display:flex;
    gap:22px;
    font-size:13.5px;
    margin-top:6px;
  }
  .cover-links a{
    text-decoration:none;
    border-bottom:1px solid var(--ink);
    padding-bottom:2px;
  }

  /* ===== Section heading ===== */
  .section-head{
    display:grid;
    grid-template-columns: 0.55fr 1.45fr;
    gap:clamp(20px,4vw,48px);
    padding:56px 0 30px;
    border-top:1px solid var(--line);
    align-items:start;
  }
  .section-num{
    font-size:13px;
    opacity:0.55;
    font-variant-numeric: tabular-nums;
    padding-top:6px;
  }
  .section-title{
    font-size:clamp(28px,3.6vw,42px);
  }
  .section-intro{
    font-size:15.5px;
    line-height:1.65;
    max-width:62ch;
    opacity:0.82;
    margin-top:14px;
  }

  /* ===== Series grids (alternating spreads) ===== */
  .spread{
    padding-bottom:56px;
  }
  .spread-grid{
    display:grid;
    gap:18px;
    align-items:start;
  }
  .g3{ grid-template-columns: repeat(3, 1fr); }
  .g2-asym{ grid-template-columns: 1.4fr 1fr; }
  .g2-asym.flip{ grid-template-columns: 1fr 1.4fr; }
  .g2-asym.flip .frame-item:first-child{ order:2; }

  .frame-item{ position:relative; }
  .frame-item .frame{
    position:relative;
    overflow:hidden;
    background:var(--frame-b);
  }
  .frame-item:nth-of-type(3n+1) .frame{ background:var(--frame-a); }
  .frame-item:nth-of-type(3n+2) .frame{ background:var(--frame-b); }
  .frame-item:nth-of-type(3n+3) .frame{ background:var(--frame-c); }
  .ratio-tall{ aspect-ratio:3/4; }
  .ratio-wide{ aspect-ratio:16/10; }
  .ratio-square{ aspect-ratio:1/1; }

  .frame::before{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, transparent 1px, transparent 4px);
  }
  .frame.photo{
    aspect-ratio:auto;
  }
  .frame.photo::before{ display:none; }
  .frame img.frame-photo{
    position:static;
    width:100%; height:auto;
    object-fit:contain;
    display:block;
  }
  figcaption{
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    gap:12px;
    font-size:12.5px;
    opacity:0.68;
  }
  figcaption .cap-title{ font-style:italic; font-family:'Times New Roman', Times, serif; opacity:1; }

  /* ===== Portfolio sub-index & series ===== */
  .portfolio-index{
    display:flex;
    flex-wrap:wrap;
    gap:10px 22px;
    margin-top:22px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  .portfolio-index a{
    font-size:13px;
    text-decoration:none;
    opacity:0.7;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
  }
  .portfolio-index a:hover, .portfolio-index a:focus-visible{ opacity:1; border-color:var(--rust); }

  .series-block{
    padding:52px 0;
    border-top:1px solid var(--line);
    scroll-margin-top:20px;
  }
  .series-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:20px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .series-name{ font-size:clamp(22px,2.6vw,30px); }
  .series-notes{
    font-size:12px;
    opacity:0.55;
    letter-spacing:0.01em;
    text-align:right;
  }
  .plate-tag{ font-variant-numeric:tabular-nums; }
  .caption-block{
    margin-top:16px;
    max-width:68ch;
  }
  .caption-block h4{
    font-family:'Times New Roman', Times, serif;
    font-style:italic;
    font-weight:400;
    font-size:19px;
    margin-bottom:8px;
  }
  .caption-block p{
    font-size:14.5px;
    line-height:1.68;
    opacity:0.82;
    margin-bottom:8px;
  }
  .caption-meta{
    font-size:11.5px;
    opacity:0.5;
    margin-top:10px;
  }
  .more-label{
    font-size:12px;
    opacity:0.55;
    margin:34px 0 14px;
  }
  .single-frame{
    max-width:780px;
  }

  /* ===== Interviews list ===== */
  .interview-list{
    border-top:1px solid var(--line);
  }
  .interview-row{
    display:grid;
    grid-template-columns: 0.9fr 2fr 0.5fr;
    gap:20px;
    align-items:baseline;
    padding:20px 0;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    transition:opacity .2s ease;
  }
  .interview-row:hover, .interview-row:focus-visible{ opacity:0.65; }
  .interview-pub{
    font-size:12.5px;
    letter-spacing:0.02em;
    opacity:0.6;
  }
  .interview-title{
    font-family:'Times New Roman', Times, serif;
    font-style:italic;
    font-size:clamp(16px,2vw,20px);
  }
  .interview-date{
    font-size:12.5px;
    opacity:0.55;
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  @media (max-width:640px){
    .interview-row{
      grid-template-columns:1fr;
      gap:6px;
    }
    .interview-date{ text-align:left; }
  }

  /* ===== Pull quote ===== */
  .pull{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:clamp(48px,8vw,88px) 0;
    text-align:center;
  }
  .pull blockquote{
    font-family:'Times New Roman', Times, serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(24px,4vw,40px);
    line-height:1.35;
    max-width:22ch;
    margin:0 auto;
  }
  .pull cite{
    display:block;
    margin-top:22px;
    font-family:'Times New Roman', Times, serif;
    font-style:normal;
    font-size:13px;
    opacity:0.6;
  }

  /* ===== About / colophon ===== */
  .about{
    display:grid;
    grid-template-columns: 0.8fr 1.2fr;
    gap:clamp(28px,5vw,64px);
    padding:56px 0 64px;
    border-top:1px solid var(--line);
  }
  .about-frame{
    aspect-ratio:4/5;
    background:var(--frame-d);
    position:relative;
    overflow:hidden;
  }
  .about-copy p{
    font-size:15.5px;
    line-height:1.7;
    opacity:0.86;
    max-width:58ch;
    margin-bottom:16px;
  }
  .about-copy p:last-child{ margin-bottom:0; }
  .stat-row{
    display:flex;
    gap:clamp(24px,4vw,48px);
    margin-top:28px;
    flex-wrap:wrap;
  }
  .stat{ min-width:100px; }
  .stat b{
    display:block;
    font-family:'Times New Roman', Times, serif;
    font-size:26px;
    font-weight:500;
  }
  .stat span{ font-size:12px; opacity:0.6; }

  /* ===== Contact / footer ===== */
  footer{
    border-top:1px solid var(--line);
    padding:44px 0 28px;
  }
  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:24px;
  }
  .footer-title{
    font-size:clamp(30px,5vw,52px);
    font-style:italic;
  }
  .footer-links{
    display:flex;
    gap:20px;
    font-size:13.5px;
  }
  .footer-links a{ text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px;}
  .footer-links a:hover{ border-color:var(--ink); }
  .footer-meta{
    margin-top:34px;
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    opacity:0.55;
    flex-wrap:wrap;
    gap:10px;
  }

  .theme-toggle{
    position:fixed;
    right:18px; bottom:18px;
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper-dim);
    color:var(--ink);
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    z-index:50;
  }
  .theme-toggle:focus-visible, a:focus-visible, nav.subnav a:focus-visible{
    outline:2px solid var(--rust);
    outline-offset:2px;
  }

  @media (max-width: 780px){
    .cover{ grid-template-columns:1fr; }
    .section-head{ grid-template-columns:1fr; }
    .g3{ grid-template-columns:1fr 1fr; }
    .g2-asym, .g2-asym.flip{ grid-template-columns:1fr; }
    .g2-asym.flip .frame-item:first-child{ order:0; }
    .about{ grid-template-columns:1fr; }
    .footer-row{ flex-direction:column; align-items:flex-start; }
  }
  @media (max-width: 480px){
    .g3{ grid-template-columns:1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
  }

</style>
</head>
<body>

  <header class="masthead">
    <div class="wrap">
      <div class="masthead-row">
        <div class="wordmark">Audrina Xie</div>
        <div class="masthead-meta">
          <span>Photography</span>
          <span>Los Angeles, CA</span>
        </div>
      </div>
      <nav class="subnav">
        <a href="index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="interviews.html">Interviews</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="contact-page" class="wrap" style="padding:56px 0 96px;">
      <span class="kicker">Contact</span>
      <h1 class="cover-title" style="margin-top:14px;">Let's talk.</h1>
      <p class="cover-dek" style="margin-top:18px;">For prints, assignments, or just to say hello.</p>
      <div class="cover-links" style="margin-top:26px;">
        <a href="mailto:xiexy0804@gmail.com">xiexy0804@gmail.com</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div class="footer-row">
        <h2 class="footer-title serif">Let's talk.</h2>
        <div class="footer-links">
          <a href="mailto:xiexy0804@gmail.com">xiexy0804@gmail.com</a>
        </div>
      </div>
      <div class="footer-meta">
        <span>Audrina Xie — Photography</span>
        <span>Los Angeles, CA — Est. 2026</span>
      </div>
    </div>
  </footer>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>

  <script>
    (function(){
      try{
        const btn = document.getElementById('themeToggle');
        const root = document.documentElement;
        const stored = localStorage.getItem('fn-theme');
        if(stored){ root.setAttribute('data-theme', stored); }
        btn.addEventListener('click', function(){
          const current = root.getAttribute('data-theme') === 'dark' ? 'dark' :
                          (root.getAttribute('data-theme') === 'light' ? 'light' :
                          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
          const next = current === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try{ localStorage.setItem('fn-theme', next); }catch(e){}
        });
      }catch(e){ /* storage unavailable, theme toggle degrades to no-op */ }
    })();

</script>

</body>
</html>
